[project]
name = "laya-jp"
version = "0.1.0"
description = "Locked Japanese baseline for convaiinnovations/laya-multilingual"
requires-python = ">=3.11"
dependencies = [
    "huggingface_hub",
    "laya==0.3.11",
    "numpy",
    "pytest",
    "pyyaml",
]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.uv]
package = true

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
