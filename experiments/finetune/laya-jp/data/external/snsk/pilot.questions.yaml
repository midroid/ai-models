            - 追加作業の要望はあるが、具体的な作業範囲が両社で確認されていない。
            - 具体的な作業範囲は両社で確認されているが、費用負担または納期の案がまだ整っていない。
            - 作業範囲・費用負担・納期の案が両社で確認されているが、有効な両社承認がそろっていない。
            - 作業範囲・費用負担・納期の両社承認がそろい、付された条件があればその充足も両社で確認されている。

  - id: N01
