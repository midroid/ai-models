        受入合意と切り離して後日対応できる。

        【正式議事録】
        所定の受入責任者による確認済みの記載：
        「本日の結果に基づき、今回の納入は受入可とします。
        画面注記の句読点は保守で修正願いますが、本件は受入を妨げる条件ではありません」。
        当該表示修正は、担当者と対応期限を付けて保守台帳に登録済み。
        他に受入を妨げる条件はない。
      questions:
        acceptance_agreed:
          type: noul
          instructions: 本プロジェクトの受入ルールと正式議事録に照らし、今回の納入の受入合意は成立しているか。
          criteria:
            "true": 所定の責任者の受入可の記載があり、残る表示修正も規定の後日対応条件を満たしている。
            "false": 所定の責任者の受入可の記載がない、または受入を妨げる条件が残っている。

  - id: N10
    group: noul
    title: 熟練者の手組み試作品と量産工程評価
    japan_focus: 試作と量産の橋渡し、手合わせ、生産技術への移管
    tags: [製品開発, 量産準備, 工程評価]
    input:
      state: |
        【量産工程評価の完了条件】
        今回承認された標準作業と量産予定設備を用いて製造し、所定の工程評価結果を記録して、
        生産技術責任者が確認した場合に、量産工程の評価完了と扱う。
        熟練者による手調整を含む開発試作は、製品性能の確認に使えても、この工程評価には代用しない。

        【試作報告】
        熟練者が開発室で手組みと手調整を行った試作品が、性能試験に全件合格した。
        量産予定設備は未稼働で、標準作業による製造実績はない。
        所定の工程評価結果と生産技術責任者の確認もない。
        開発担当は「現物が動いたので量産準備は完了です」と報告した。
      questions:
        production_process_evaluated:
          type: noul
          instructions: 提示された完了条件に照らし、量産工程の評価は完了しているか。
          criteria:
            "true": 標準作業と量産予定設備での工程評価記録があり、生産技術責任者の確認もある。
            "false": その工程評価記録または責任者の確認がない。

  - id: N11
    group: noul
    title: 一枚の保守受付票にまとめられた二つの修正
    japan_focus: 保守一式、顧客窓口での依頼集約、既存修正と追加要望
    tags: [商慣習, 保守範囲, 依頼全体と一部]
    input:
      state: |
        【保守一式の合意範囲】
        既存帳票を承認済み仕様どおりに直す作業は定額保守に含む。
        新しい表示項目や集計単位の追加は、工数にかかわらず変更要求として別途合意する。
        受付票を一枚にまとめることや、顧客側で「修正」と呼ぶことによって範囲は変わらない。

        【受付票H-28と添付資料】
        件名は「請求書の部署表示の修正」。依頼は次の二点。
        ①現在空欄になっている部署名を表示する。
        ②部署が複数ある取引先では、部署ごとの小計行も表示する。
        承認済み仕様の項目一覧には部署名があり、帳票見本には取引先単位の合計行が一つある。
        部署単位の集計は仕様にない。①は既存処理の不具合と調査で確認済み。
        ②について過去の変更合意はない。
        顧客窓口：「現場の依頼を一枚にまとめました。従来の請求書の修正ですので、保守の中でお願いします」。
      questions:
        maintenance_in_scope:
          type: noul
          instructions: 受付票H-28の依頼全体を、追加の変更合意なしで定額保守の範囲内として受け付けられるか。
          criteria:
            "true": 依頼のすべてが提示された定額保守の合意範囲に含まれる。
            "false": 依頼の中に、別途の変更合意が必要な範囲が含まれる。

  - id: N12
    group: noul
    title: 試行は続くが年度をまたぐ本導入の回答
    japan_focus: 年度予算、稟議、婉曲な回答、試行と本導入の商談分離
    tags: [商慣習, 営業, 対象範囲と期間]
    input:
      state: |
        【営業管理の判定対象】
        今期は2026年4月1日〜2027年3月31日。
        判定対象の商談は「8拠点への本導入」で、既に発注済みの1拠点の試行支援は別案件とする。
        顧客が本導入の開始を来期以降に限定した場合は、今期の本導入を見送る表明として扱う。
        単に回答を保留しただけでは、見送りとは扱わない。

        【2027年3月10日の顧客メール】
        「試行ではお世話になっております。8拠点の本導入について、今期の追加稟議は起こさず、
        来期予算で進める方針となりました。開始日は4月1日以降の案で改めてご相談させてください。
        一方、試行中の拠点への3月中の支援は、発注済みの内容で引き続きお願いいたします」。

        【翌日の返信】
        営業担当：「では、今月中の打合せは予定どおりお願いできますでしょうか」。
        顧客：「ぜひお願いします。4月開始案のすり合わせと、試行の振り返りをできれば幸いです」。
      questions:
        current_period_declined:
          type: noul
          instructions: このやり取りで、判定対象である今期の本導入を顧客は見送ると表明しているか。
          criteria:
            "true": 今期の本導入を行わない、または本導入の開始を来期以降に限定する旨を表明している。
            "false": 今期の本導入を検討継続・保留している、または今期に行わないという表明がない。

  - id: X01
    group: composite
    title: 年度末の検収依頼と返信期限
    japan_focus: 年度末締め、検収、取引先への配慮と社内ルール
    tags: [購買, 期限, 事実確認, 判断の合成]
    input:
      state: |
        【時点】
        現在は2026年3月31日14:30、日本標準時。以下の時刻もすべて日本標準時。

        【社内検収ルール】
        倉庫への到着と検収完了は別であり、受入検査が完了して初めて検収済みと扱う。
        検収日には受入検査の実際の完了日を記録する。希望する日付への前倒しは認めない。

        【記録】
        品物は本日13:00に倉庫へ到着済み。
        受入検査は未着手。検査担当の予定表には2026年4月2日10:00実施予定とある。
        受入検査の完了記録はない。

        【仕入先のメール】
        いつも大変お世話になっております。
        年度末の締めの都合がございまして、恐縮ですが本日3月31日付で検収済みとして
        ご返信いただけないでしょうか。社内処理の締切のため、本日16:00までにご回答をお願いいたします。
        難しい場合も、その旨を同時刻までにお知らせいただけますと幸いです。
      questions:
        request_kind:
          type: choice
          instructions: |
            仕入先メールの主たる依頼を1つ選ぶ。
            受入検査の予定と照らして、求められている手続を分類する。
          criteria:
            delivery_change: 品物が倉庫に到着する予定日の変更を求めている。
            invoice_copy: 請求書の写しの再送を求めている。
            acceptance_date_advance: 受入検査の完了前の日付で、検収済みとして扱うことを求めている。
            other_or_unclear: いずれにも該当しない、または主たる依頼を特定できない。
        response_urgency:
          type: score
          instructions: |
            現在時刻から、メールで明記された回答期限までの残り時間に基づく返信の緊急度を評価する。
            依頼を受け入れるかどうかや、検査の実施予定日はこの評価に含めない。
            時間は営業時間ではなく、連続した経過時間で比較する。
          criteria:
            - 明示された回答期限まで72時間を超える余裕がある、または回答期限が明示されていない。
            - 明示された回答期限まで24時間を超え、72時間以下の余裕がある。
            - 明示された回答期限まで4時間を超え、24時間以下の余裕がある。
            - 明示された回答期限がまだ到来しておらず、残り時間は4時間以下である。
            - 明示された回答期限に到達している、または回答期限を過ぎている。
        inspection_completed:
          type: noul
          instructions: 提示された記録から、現時点で受入検査が完了していると確認できるか。
          criteria:
            "true": 受入検査を実施し、完了したことを示す記録がある。
            "false": 受入検査が未完了である、または完了を示す記録がない。

  - id: X02
    group: composite
    title: 車載製品の検査治具設定を量産工程に反映する
    japan_focus: 工程変更、検査治具、顧客と工場品質部門の量産承認
    tags: [車載, 工程変更, 検証と承認]
    input:
      state: |
        【本案件の変更分類と反映ルール】
        製品に書き込むデータの変更は製品ソフト変更、検査治具側だけの設定変更は検査工程変更とする。
        検査工程変更の量産反映には、対象条件の検証完了と、顧客・工場品質部門の正式承認が必要。
        正式承認は承認台帳の記録で確認する。

        【変更票E-24と検証記録】
        変更するのは検査治具の読取り待ち時間の設定だけ。
        製品のハード、製品に書き込むソフトとデータ、製品仕様の合否基準は変更しない。
        対象となる全品番・全ラインの試験項目と条件を確定済み。
        全対象条件で試験を実施して合格し、結果と設定版F12の対応も記録済み。
        独立した確認担当が証跡をレビューし、検証記録の確認を完了した。

        【承認台帳】
        顧客と工場品質部門の両方が、E-24の設定版F12の量産反映を正式承認済み。
        適用範囲と設定版に食い違いはなく、未完了の承認条件もない。
        製造担当は「以前は口頭だけで変えていましたが、今回は記録もそろっています」と報告した。
      questions:
        change_class:
          type: choice
          instructions: 本案件の分類ルールに照らし、E-24で実際に変更する対象を分類する。
          criteria:
            product_software: 製品に書き込むソフトまたはデータの変更。
            inspection_process: 製品のソフトやデータは変えない、検査治具側の設定変更。
            product_hardware: 製品ハード部品または基板の変更。
            unknown: 提示された情報から変更対象を特定できない。
        verification_stage:
          type: score
          instructions: E-24の対象条件に対する検証証跡の到達段階を評価する。量産反映の承認の有無とは別に、検証の実績を判定する。
          criteria:
            - 対象条件と試験項目が確定していない。
            - 対象条件と試験項目は確定しているが、試験は実行されていない。
            - 試験を実行した記録はあるが、未実行条件または未解決の不合格がある。
            - 全対象条件の試験が合格し設定版との対応も記録されているが、独立した確認担当の証跡レビューは未完了である。
            - 全対象条件の試験が合格し設定版との対応が記録され、独立した確認担当の証跡レビューも完了している。
        production_approval_recorded:
          type: noul
          instructions: E-24の設定版F12について、顧客と工場品質部門による所定の量産反映承認は台帳で確認できるか。
          criteria:
            "true": 対象の変更票と設定版に対応する両者の正式承認があり、未完了の承認条件もない。
            "false": 両者の正式承認がそろっていない、設定版が一致しない、または未完了の承認条件がある。

  - id: X03
    group: composite
    title: 地方工場へ持ち込まれた現地書換え用ファームウェア
    japan_focus: 出張サービス、現地改修、協力会社への特急対応要請
    tags: [組込み, 現地保守, 変更承認]
    input:
      state: |
        【現地保守の運用ルール】
        現地設備のファームウェアを書き換える場合、設備番号と投入版を指定した変更承認が必要。
        客先担当者からの作業催促や、社内メールによるファイル送付だけでは変更承認としない。
        評価する業務は「製品の検査を完了し、結果を正式登録すること」。
        品質部門が承認した代替検査と手動登録も、この業務の完了として認める。

        【現場の状況】
        地方工場の一部の検査端末では、自動読取りが使えない。
        品質部門承認済みの代替検査と手動登録により、現在はすべての製品で検査と正式登録を完了できる。
        通常より時間はかかるが、処理を完了できない製品はない。
        客先担当者は「ライン停止に近いので、とにかく今日直して」と催促している。

        【作業依頼と承認記録】
        持ち込んだ依頼は端末T08のファームウェアをF3.1からF3.2へ書き換えるもの。
        ハード部品交換や操作教育は依頼されていない。
        F3.2のファイルは開発担当から届いているが、T08への投入を指定した変更承認は未登録。
        この作業に適用できる緊急変更の例外承認もない。
      questions:
        work_type:
          type: choice
          instructions: 今回持ち込まれた作業依頼の内容を、記載された変更対象に基づいて分類する。
          criteria:
            hardware_replacement: 端末のハード部品交換。
            user_training: 操作方法の教育だけを行う作業。
            firmware_update: 端末のファームウェアを書き換える作業。
            unclear: 依頼された作業の対象を特定できない。
        current_impact:
          type: score
          instructions: 現在の検査・正式登録業務の支障を評価する。承認された代替手段を含めた完了可否で判定し、催促の強さから停止を推測しない。
          criteria:
            - すべての製品で、検査と正式登録を通常どおり支障なく完了できる。
            - すべての製品で通常の方法により完了できるが、遅延や追加操作が生じている。
            - 通常の方法で完了できない製品があるが、承認された代替手段で全製品の検査と正式登録を完了できる。
            - 承認された代替手段を含めても完了できない製品があるが、完了できる製品もある。
            - 承認された代替手段を含め、全製品の検査と正式登録が完了できない。
        update_authorized:
          type: noul
          instructions: 現地保守の運用ルールに照らし、T08へのF3.2投入に適用できる変更承認は確認できるか。
          criteria:
            "true": 設備番号と投入版を指定した通常の変更承認、または適用可能な緊急変更の例外承認がある。
            "false": 当該設備と投入版に適用できる通常承認も緊急の例外承認もない。

  - id: X04
    group: composite
    title: 年度末の本体検収と追加帳票の引継ぎ
    japan_focus: 年度末の検収、一式案件の範囲分け、議事録、残件付きの運用引継ぎ
    tags: [エンタープライズ, 検収範囲, 追加作業, 運用移管]
    input:
      state: |
        【この案件で合意した管理方法】
        本体の注文P-40と追加変更票CH-18は別の受入単位。受入は、両社の受入責任者が
        対象単位と判定を記録した確認票で確定する。現場の使用開始や週報の見出しだけでは確定しない。
        本体の受入を登録しても、別単位の追加作業まで完了した扱いにはしない。
        運用引継ぎは、連絡先・監視手順・復旧手順・未処理事項がそろい、当番責任者が受領確認すれば完了。
        未処理事項がある場合は、対象・担当・対応予定日・それまでの運用方法を記録する。

        【3月28日時点の書類】
        ・注文P-40の範囲：受注登録と標準CSV出力。
        ・変更票CH-18の範囲：部門別の月次集計帳票の追加。納入予定は4月15日。
        ・3月27日付の受入確認票：対象欄はP-40、判定欄は「合格・受入」。
          両社受入責任者が承認済み。備考は「CH-18は4月15日納入後に別途確認」。
        ・現場議事録：「一式お預かりしました。来月も引き続きお願いします」。
        ・営業週報の見出し：「年度内検収完了」。

        【判定対象の業務状況】
        対象業務は受注登録と月次の部門別集計の完了。
        受注登録は新システムで通常どおり完了している。部門別集計の自動帳票はまだ使えない。
        今月分は合意済みの代替手順により、標準CSVを既存の集計表へ取り込み、
        全対象部門の集計を期限内に完了した。照合も済み、未処理の伝票はない。

        【運用引継ぎ票】
        連絡先・監視手順・復旧手順の記載がある。
        未処理事項欄には「CH-18／担当：開発部／4月15日納入予定／それまではCSVと既存集計表を使用」。
        日勤の当番責任者がこれらの内容を確認し、受領欄に記録している。
      questions:
        acceptance_scope:
          type: choice
          instructions: 記録時点で確定している受入の範囲を選ぶ。
          criteria:
            entire_project: 本体P-40と追加CH-18の両方が受入済み。
            original_order_only: 本体P-40は受入済みで、追加CH-18の受入はまだ。
            change_only: 追加CH-18は受入済みで、本体P-40の受入はまだ。
            neither_accepted: 本体P-40と追加CH-18のどちらも受入はまだ。
        remaining_impact:
          type: score
          instructions: 記録時点の受注登録・月次の部門別集計に残る業務上の支障を評価する。
          criteria:
            - 対象業務は全対象部門で通常どおり完了し、遅延・追加操作・代替手段の利用もない。
            - 対象業務は通常の方法で全件完了するが、遅延または追加操作がある。
            - 通常の方法で完了できない処理があるが、代替手段を使えば全件完了できる。
            - 代替手段を含めても完了できない処理が一部残っている。
            - 代替手段を含め、対象業務のすべての処理が完了できない。
        operations_handover_complete:
          type: noul
          instructions: この案件で合意した条件に照らし、日勤運用への引継ぎは完了しているか。
          criteria:
            "true": 必要4項目がそろい、残件があれば指定された管理情報も記載され、当番責任者の受領確認がある。
            "false": 必要な情報や残件の管理情報が不足している、または当番責任者の受領確認がない。
