    title: 保守で直す注記を残した正式受入
    japan_focus: 条件の読み分け、検収会議、保守対応との切分け
    tags: [エンタープライズ, 受入合意, 例外適用]
    input:
      state: |
        【本プロジェクトの受入ルール】
