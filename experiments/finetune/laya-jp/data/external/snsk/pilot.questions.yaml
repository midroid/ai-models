schema_version: "1.0"
benchmark_id: jev_jp_business_pilot
version: "0.3.0"
language: ja-JP
created_at: "2026-09-21"
status: frozen_for_evaluation
description: |
  日本語の業務文書と、日本の業務慣行・表記を含む判断ベンチマークの試作。
  事例、組織、社内規程はすべて架空。提示した情報だけで判断する。
  法律や一般的慣行の知識テストではなく、提示情報を業務判断に適用する能力を測る。
planned_case_counts:
  choice: 30
  score: 30
  noul: 30
  composite: 10
pilot_case_counts:
  choice: 12
  score: 12
  noul: 12
  composite: 4
counting_unit: case
atomic_question_count: 48
transport_note: |
  このYAML全体はAPIリクエストではない。
  各ケースのinput.stateとinput.questionsだけを取り出し、実行時のmodelを付加する。
  TypeSafeの直接APIの型名を採用。利用経路による変換は実行側で行う。
  id、title、tags、japan_focus、想定解・採点用データはモデルに送らない。
cases:
  - id: C01
    group: choice
    title: 根回し済みの購買案件
    japan_focus: 稟議、根回し、上位者の口頭了解
    tags: [購買, 承認権限, 形式と実態]
    input:
      state: |
        【社内購買規程】
        税込100万円以上の発注には、本部長による稟議システム上の承認が必要。
        チャットや口頭の了解は、この承認の代わりにならない。
        見積書に不備がある場合は、承認手続より先に見積書を差し戻す。
        本件に適用できる緊急発注の例外はない。

        【案件記録】
        什器の発注額は税込120万円。見積書の記載内容は確認済みで、不備なし。
        部長は「関係者への根回しは済んでいます」とコメントした。
        本部長からチャットで「内容に異論はありません。進めておいてください」と返信があった。
        稟議システムでは、部長承認済み、本部長の承認欄は未承認。
        仕入先は本日中の注文書送付を希望している。
      questions:
        next_action:
          type: choice
          instructions: |
            案件記録に社内購買規程を適用し、注文書を発行する前の次の処理を1つ選ぶ。
            仕入先や関係者の希望で規程を変更しない。
          criteria:
            issue_order: 必要な承認が完了しているため、注文書を発行する。
            return_quote: 見積書に不備があるため、仕入先に見積書を差し戻す。
            obtain_approval: 注文書の発行を保留し、本部長のシステム承認を取得する。
            clarify: 金額、見積書の状態、承認状況の情報が不足し、処理を決められない。

  - id: C02
    group: choice
    title: 前向きな言葉を含む今期の見送り
    japan_focus: 婉曲な断り、定型的な謝意、年度単位の商談管理
    tags: [営業, 婉曲表現, 対象期間]
    input:
      state: |
        【営業管理ルール】
        今期の商談だけを更新する。次年度の可能性は別の商談として管理する。
        「受注」は今期の導入を明確に承諾した場合、「継続検討」は今期について判断を保留している場合、
        「見送り」は今期の導入を断った場合に使う。価格の提示し直しを求められた場合は「再見積」とする。

        【顧客からのメール】
        平素より大変お世話になっております。
        ご提案の趣旨はよく理解でき、弊社としても前向きに検討してまいりました。
        誠に恐縮ではございますが、今期分につきましては見送らせていただければ幸いです。
        次年度の予算が固まりましたら、改めて当方からご相談申し上げます。
        今後とも何卒よろしくお願い申し上げます。
      questions:
        deal_status:
          type: choice
          instructions: 営業管理ルールと顧客メールに基づき、今期の商談の更新先を1つ選ぶ。
          criteria:
            declined: 今期の導入は見送り。
            won: 今期の導入が承諾され、受注となった。
            considering: 今期の導入について判断を保留し、検討が継続している。
            requote: 今期の導入に向けて価格の再提示を求められている。
            unclear: 今期の導入について、メールからいずれの状態か決められない。

  - id: C03
    group: choice
    title: 和暦の検収日と年度の振り分け
    japan_focus: 和暦、西暦、4月始まりの年度、年度末と請求日のずれ
    tags: [管理台帳, 日付表記, 年度境界]
    input:
      state: |
        【社内設備管理台帳のルール】
        この台帳の所属年度は検収日で決める。請求書発行日、支払日では決めない。
        2025年度は2025年4月1日から2026年3月31日まで。
        2026年度は2026年4月1日から2027年3月31日まで。
        和暦の令和8年は西暦2026年に対応する。
        検収日が不明、または記録同士で食い違う場合は確認に回す。

        【書類】
        検収書：令和８年３月３１日、受入検査完了。
        請求書：２０２６／０４／０３ 発行。
        支払予定：2026-04-30。
        検収日の訂正記録はない。
      questions:
        ledger_year:
          type: choice
          instructions: 社内設備管理台帳のルールに従い、この案件の台帳上の所属年度を選ぶ。
          criteria:
            fiscal_2026: 2026年度の台帳に登録する。
            review: 検収日の不明または食い違いを確認してから登録する。
            fiscal_2025: 2025年度の台帳に登録する。

  - id: C04
    group: choice
    title: 内示改訂と分納済みの確定指示
    japan_focus: 月次内示、確定納入指示の改訂、分納、注文書の後送
    tags: [商慣習, 生産管理, 改訂と消込み]
    input:
      state: |
        【部品P20の取引運用】
        月次内示は生産準備用。出荷数量は納入日・指示番号ごとの確定納入指示で管理する。
        同じ指示番号の改訂は旧版を置き換え、数量欄はその指示の納入総数を表す。
        納入済み分は対応する指示番号から消し込む。別の指示番号は独立した納入分である。
        EDI確定指示と社内出荷承認がそろえば、紙の注文書の後送を待たずに出荷できる。

        【9月10日10時の出荷担当向け記録】
        ・月次内示：9月分200個。9月9日の改訂で150個になった。
        ・EDI A-0910 第1版：9月10日納入、80個、確定。
        ・納入実績：9月10日朝、A-0910として20個を納入済み。
        ・EDI A-0910 第2版：9月10日9時受信、同日納入、60個、確定。
        ・EDI B-0910 第1版：9月10日午後納入、30個、確定。納入実績は0個。
        A-0910第2版とB-0910の社内出荷承認は完了し、残りを出せる在庫がある。
        顧客の連絡は「月の内示を減らしました。注文書はいつもどおり後送します」。
        このほかに指示の改訂、取消し、納入実績はない。
      questions:
        shipment_quantity:
          type: choice
          instructions: 記録時点から9月10日の残りの納入に向けて、合計何個を出荷手配するか選ぶ。
          criteria:
            ship_40: 残り40個を出荷手配する。
            ship_70: 残り70個を出荷手配する。
            ship_90: 残り90個を出荷手配する。
            ship_150: 残り150個を出荷手配する。
            wait_for_paper: 今回は出荷手配せず、紙の注文書を待つ。

  - id: C05
    group: choice
    title: 客先打合せで頼まれた車載通信設定の変更
    japan_focus: 客先常駐、口頭の宿題、車種横断の設計変更審査
    tags: [車載, 設計変更, 承認経路]
    input:
      state: |
        【車載表示ユニット開発の変更受付ルール】
        客先要求により量産ソフトウェアの通信周期を変える場合は、変更管理窓口へ登録し、
        関連ユニットへの影響と検証範囲を審査してから実装に着手する。
        誤字の修正だけなら文書担当へ回す。合意済み仕様どおりに動かない現象は不具合窓口へ回す。
        打合せへの同席や担当者の了解だけでは変更審査完了とはしない。

        【客先打合せメモ】
        現行の量産ソフトは合意済みの通信周期どおりに動作しており、不具合報告はない。
        客先担当者：「次の車種では相手側ユニットに合わせ、通信周期を半分にしてほしい。
        パラメータだけなので、次回までに軽く直しておいてもらえますか」。
        同じ通信処理を別車種でも使用している。変更要求の登録と影響審査は未実施。
      questions:
        intake_route:
          type: choice
          instructions: 変更受付ルールに照らし、この依頼を実装前に最初に回す窓口を選ぶ。
          criteria:
            defect_desk: 合意済み仕様からの逸脱として、不具合窓口へ回す。
            document_desk: 誤字だけの修正として、文書担当へ回す。
            implementation_team: 審査済みの変更として、そのまま実装担当へ回す。
            change_control: 新しい仕様要求として、変更管理窓口へ登録し影響審査に回す。
            clarification: 現行仕様との関係を判断する情報が不足しているため、要求内容を確認する。

  - id: C06
    group: choice
    title: ロット限定の特別採用と出荷可否
    japan_focus: 特別採用、限度見本、ロット単位の品質記録
    tags: [車載, 品質保証, 限定承認]
    input:
      state: |
        【当該部品の出荷ルール】
        外観不良品は原則隔離する。ただし、顧客と自社品質部門の特別採用承認があり、
        対象ロット・欠点の種類・数量上限・有効期限のすべてが承認範囲内で、
        指定された追加検査にも合格した場合は、その承認番号を記録して出荷できる。
        特別採用とは、この案件で範囲を限定して例外的に受け入れる承認を指す。

        【承認票と現品】
        両者承認済みの承認票S-18：ロットL2609、筐体表面の浅い擦り傷、上限40個、
        有効期限2026年9月30日。追加検査は承認票に指定した外観・機能検査。
        本日の出荷候補：同ロットの30個。欠点は指定範囲の擦り傷だけ。
        30個すべて追加検査合格。他の未解決不適合はない。
        S-18による出荷実績はまだ0個。本日は2026年9月21日。
      questions:
        disposition:
          type: choice
          instructions: この承認票と出荷ルールを適用し、今回の30個の処置を選ぶ。
          criteria:
            ship_with_record: 承認範囲内として、承認番号S-18を記録して30個を出荷する。
            expand_approval: 数量やロットなどが承認範囲外のため、承認範囲の変更を申請する。
            inspect_first: 必要な追加検査が完了していないため、その検査を先に行う。
            always_scrap: 外観不良がある以上、承認内容にかかわらず全数廃棄する。
            clarify: 承認範囲と現品を照合する情報が不足しているため確認する。

  - id: C07
    group: choice
    title: 客先実機でだけ起きる再起動
    japan_focus: 現地現物、客先設備、元請からの責任切分け要求
    tags: [組込み, 不確実性, 初動調査]
    input:
      state: |
        【不具合調査の初動ルール】
        ソフト起因かハード起因かを断定できる証拠がない場合は、責任部署を確定せず、
        発生個体の識別、ハード・ソフトの版、電源条件、発生操作、ログを先に収集する。
        自社評価機で再現しないことだけを、異常が存在しない証拠として扱わない。

        【現場報告】
        地方工場の操作盤が作業開始時に時々再起動する。本社の机上評価では再現しない。
        現地個体の製番、基板版、ソフト版、電源測定値、発生時ログは未取得。
        現地担当：「電源かもしれません」。協力会社：「ソフトのタイミングかもしれません」。
        元請担当者は、本日中にどちらの会社が原因か報告してほしいと求めている。
      questions:
        investigation_action:
          type: choice
          instructions: 初動ルールと現在の証拠から、次に行う調査上の処理を選ぶ。原因の推測を確定事実にしない。
          criteria:
            software_fault: ソフトの問題と確定し、ソフト担当会社だけに修正を指示する。
            hardware_fault: 電源の問題と確定し、電源担当会社だけに交換を指示する。
            close_report: 本社で再現しないため、異常なしとして報告を終了する。
            collect_evidence: 原因未確定として、現地個体・版・電源条件・操作・ログを収集する。

  - id: C08
    group: choice
    title: 見積別紙にあるCSVと検収会議の二つの依頼
    japan_focus: 一式見積の別紙、議事録、既存仕様の修正と追加要望の切分け
    tags: [エンタープライズ, 合意範囲, 複数依頼]
    input:
      state: |
        【案件の文書管理と受付】
        作業範囲は署名済み見積の本文と、その本文から参照した別紙で決める。
        対象機能の具体的な出力仕様は両社承認済みの項目定義書で確認する。
        その後の変更は両社の変更承認がそろったものだけを反映する。
        合意済み仕様との相違は不具合、未合意の機能追加は変更要求として受け付ける。

        【資料】
        ・署名済み見積Q-14：「標準請求書PDFと別紙Dの連携機能を含む。
          別紙Dに記載のない個別帳票・連携は対象外」。
        ・別紙D：「経理取込用CSVを1種類作成」。
        ・承認済み項目定義書D-2：取引先コードは8文字で先頭ゼロを保持する。
          項目一覧に原価部門コードはない。
        ・月次打合せ議事録：「原価部門コードもあると便利。次期改善候補として見積依頼」。
          この議事録について変更承認の登録はない。

        【検収会議の受付メモ】
        顧客：「CSVのコードが123になって、00000123で登録した取引先と結び付きません。
        それと、打合せでお話しした原価部門コードも、今回の中でお願いします」。
        調査では先頭ゼロがCSV出力時に落ちている。標準PDFは正常に出力できている。
      questions:
        request_class:
          type: choice
          instructions: 先頭ゼロの保持と原価部門コードの追加について、それぞれの受付区分を選ぶ。
          criteria:
            both_changes: 先頭ゼロの保持も、原価部門コードの追加も変更要求。
            defect_and_change: 先頭ゼロの保持は不具合修正、原価部門コードの追加は変更要求。
            both_defects: 先頭ゼロの保持も、原価部門コードの追加も不具合修正。
            change_and_defect: 先頭ゼロの保持は変更要求、原価部門コードの追加は不具合修正。
            await_scope_confirmation: いずれも合意範囲を特定できず、受付区分の決定を保留。

  - id: C09
    group: choice
    title: エンドユーザーから協力会社への直接依頼
    japan_focus: 元請・協力会社の商流、常駐先での直接依頼、窓口一本化
    tags: [エンタープライズ, 役割分担, 指示系統]
    input:
      state: |
        【合意済みの変更受付ルール】
        協力会社がエンドユーザーから通常の追加要望を直接受けた場合、受領した旨を伝え、
        元請の変更窓口へ要望を共有する。実施時期や費用は協力会社だけで約束しない。
        本番業務停止の障害なら、これとは別の緊急障害窓口へ直ちに連絡する。

        【チャット】
        エンドユーザーの部門責任者から、常駐する協力会社の担当者へ連絡があった。
        「一覧画面に部署の略称を追加したいです。今の画面でも業務は回っています。
        元請を通すと時間がかかるので、御社のほうで来週対応すると返事をいただけますか」。
        元請の変更受付記録はまだない。
      questions:
        response_route:
          type: choice
          instructions: 変更受付ルールに従い、協力会社担当者が取るべき最初の対応を選ぶ。
          criteria:
            commit_directly: 部門責任者の依頼なので、来週の対応をその場で約束する。
            share_with_prime: 受領を伝え、時期・費用を確約せず元請の変更窓口へ共有する。
            emergency_route: 本番業務停止の障害として、緊急障害窓口へ連絡する。
            ignore_request: 正式な商流を通っていないため、受領連絡も共有も行わない。

  - id: C10
    group: choice
    title: 工場の大型連休を挟む変更申請締切
    japan_focus: ゴールデンウィーク、会社独自の工場カレンダー、営業日前の締切
    tags: [製品開発, 生産準備, 休日境界]
    input:
      state: |
        【生産準備部門の申請ルール】
        試作ラインの変更申請は、実施日の2工場営業日前の15:00までに提出する。
        実施日自体は営業日前の計算に含めない。国民の祝日ではなく、下記工場カレンダーを使う。

        【工場カレンダー】
        2026年4月27日・28日は工場営業日。
        2026年4月29日から5月6日までは、平日を含めすべて工場休業日。
        2026年5月7日・8日は工場営業日。

        【予定】
        試作ラインの変更実施日は2026年5月8日。
        担当者：「世間では5月1日は平日ですし、その日でよいでしょうか」と確認している。
      questions:
        submission_deadline:
          type: choice
          instructions: 提示された工場カレンダーと計算ルールだけを使い、今回の提出締切を選ぶ。
          criteria:
            may_01: 2026年5月1日15:00。
            may_07: 2026年5月7日15:00。
            may_06: 2026年5月6日15:00。
            april_28: 2026年4月28日15:00。
            unclear: 必要な工場営業日が提示されていないため、日付を確定できない。

  - id: C11
    group: choice
    title: 宿題付き設計レビューの次工程移行
    japan_focus: 設計審査会、宿題付き承認、品質会議の議事録
    tags: [製品開発, レビュー, 工程移行]
    input:
      state: |
        【工程移行ルール】
        設計審査会の指摘は「移行前必須」と「次回審査までの改善」に区分する。
        移行前必須の指摘がすべて審査責任者により完了確認され、移行承認が登録されれば、
        次回審査までの改善が残っていても次工程へ進める。
        指摘の区分を担当者の判断で付け替えることはできない。

        【審査台帳】
        移行前必須の3件はすべて修正・再確認済みで、審査責任者の完了確認がある。
        次回審査までの改善2件は未完了だが、担当者と次回審査前の期限が登録されている。
        審査責任者の次工程移行承認は登録済み。
        議事録の表題は「宿題付き承認」。次工程の開始日は明日。
      questions:
        gate_decision:
          type: choice
          instructions: 工程移行ルールと審査台帳に基づき、明日の次工程開始についての判断を選ぶ。
          criteria:
            proceed_with_tracking: 次工程を開始し、残る改善2件は登録された担当・期限で追跡する。
            wait_for_every_item: 指摘が1件でも残っているため、次工程を開始しない。
            reclassify_items: 未完了2件を担当者判断で完了扱いにしてから次工程を開始する。
            seek_missing_approval: 移行承認が未登録なので、まず審査責任者の承認を取る。
            clarify: 必須指摘の完了確認または移行承認の情報が不足しているため確認する。

  - id: C12
    group: choice
    title: 指定部品と現地交換をまとめた一式見積
    japan_focus: 一社購買、相見積、一式見積、取引先との役務の切分け
    tags: [商慣習, 購買, 承認の適用範囲]
    input:
      state: |
        【今回の購買運用】
        一社購買の承認は承認票に記載された範囲に適用する。それ以外は、必要な納期・
        保証条件を満たす候補の比較、または別途の一社購買承認が必要。
        構成する各範囲の調達方法を確定してから、一式としての発注決裁に回す。
        今回は発注を分割せず一式で手続することが社内で決まっている。

        【保守部品の交換案件】
        技術部門は「指定制御基板以外は接続保証外」と記録した。
        一社購買承認票K-9の対象欄は「指定制御基板1枚」。
        メーカー回答では、基板を指定品にすれば、認定保守会社による交換でも保証は継続する。
        認定保守会社は複数ある。

        【購買窓口に届いた資料】
        A社見積：指定基板80万円、現地交換20万円、計100万円。今週金曜日に作業可能。
        B社見積：現地交換17万円。認定会社だが最短作業日は来月初め。
        工場の保全計画では今週金曜日の停止時間に交換が必要で、日程変更の承認はない。
        A社担当は「基板は弊社の指定品ですので、交換も含めて一式でお願いします」と連絡した。
        基板の価格確認は済んでいる。現地交換について、ほかの見積や例外承認はまだない。
      questions:
        purchasing_action:
          type: choice
          instructions: 購買窓口はこの一式見積を発注決裁へ回す前にどう扱うか、次の処理を選ぶ。
          criteria:
            approve_entire_quote: K-9を見積全体に適用し、A社の一式100万円で決裁へ回す。
            compare_entire_quote: 基板の一社購買も取り直し、基板と交換の全範囲で相見積を集める。
            complete_service_procurement: 基板の一社購買は維持し、現地交換の適合候補比較または例外承認を整える。
            choose_lower_service_quote: 基板はA社、現地交換は提示額の低いB社として決裁へ回す。

  - id: S01
    group: score
    title: 丁寧な顛末書の再発防止策
    japan_focus: 顛末書、謝罪の定型表現、精神論による再発防止
    tags: [品質管理, 文体と内容, 対策の具体性]
    input:
      state: |
        【顛末書】
        このたびは弊社の納品書への品番記載誤りにより、多大なるご迷惑をお掛けいたしました。
        弁解の余地もなく、深く反省しております。ここに謹んでお詫び申し上げます。
        再発防止策として、全員が気を引き締め、従来以上に十分注意して業務に当たります。
        今後このようなことが二度とないよう、誠心誠意努めてまいります。
        何卒ご容赦賜りますよう、重ねてお願い申し上げます。
      questions:
        prevention_specificity:
          type: score
          instructions: |
            顛末書に記載された再発防止策の具体性だけを評価する。
            謝罪の丁寧さ、文章の長さ、反省の強さを加点しない。
            具体的な実施方法とは、何をどう変更・確認するかが分かる手順や仕組みを指す。
          criteria:
            - 再発防止策への言及がなく、謝罪や経緯説明にとどまる。
            - 注意や努力を表明しているが、変更する手順や仕組みが示されていない。
            - 変更する手順や仕組みはあるが、実行担当または開始時期が明記されていない。
            - 変更する手順や仕組み、実行担当、開始時期が明記されているが、効果の検証方法はない。
            - 変更する手順や仕組み、実行担当、開始時期、効果の検証方法がすべて明記されている。

  - id: S02
    group: score
    title: 控えめな障害連絡と月末の受注登録
    japan_focus: 控えめな依頼文、月末締め、紙の仮受付と正式処理の区別
    tags: [受注業務, 業務影響, 過小表現]
    input:
      state: |
        【対象業務】
        評価するのは「注文を受注システムへ正式登録する業務」。商品の発送や売上規模は評価対象外。
        社内ルール上、紙に控えるだけでは正式登録の完了にならない。

        【営業所からの連絡】
        お忙しいところ恐れ入ります。大ごとにするつもりはないのですが、
        月末締めの本日、すべての営業所で、新規注文が1件も受注システムに登録できません。
        紙に注文を控えることはできますが、正式登録の代替手段はありません。
        過去の受注を閲覧する画面は使えています。
        お手すきの際にご確認いただけますと幸いです。
      questions:
        operational_impact:
          type: score
          instructions: |
            現時点での正式な受注登録業務の支障を評価する。
            評価対象は正式登録の完了可否と影響範囲であり、依頼文の強さや担当者の遠慮ではない。
            紙の仮受付と、正式登録を完了できる代替手段を区別する。
          criteria:
            - 正式登録は通常どおり完了でき、表示や表記以外に業務上の支障はない。
            - 正式登録は全件通常の方法で完了できるが、遅延や追加操作が生じている。
            - 通常の方法では正式登録できない注文があるが、代替手段を使えば全件完了できる。
            - 代替手段を含めても正式登録できない注文があるが、完了できる注文もある。
            - 代替手段を含め、すべての営業所ですべての新規注文の正式登録が完了できない。

  - id: S03
    group: score
    title: 定期異動時の引継ぎメモ
    japan_focus: 定期異動、引継ぎ、暗黙知、「いつもの」という省略
    tags: [引継ぎ, 情報充足度, 具体性]
    input:
      state: |
        【引継ぎメモの確認基準】
        後任が前任に質問せず業務を始めるため、次の4項目を確認する。
        1. 次回対応の絶対日付と実施事項。
        2. 顧客固有の対応方法。
        3. 未了案件の具体的な内容と次の対応。未了案件がない場合は「なし」の明記。
        4. 関連資料を特定できる保存場所。具体的なフォルダパスまたは文書IDが必要。
        「いつもの」「例の件」「所定の場所」のような記載だけでは、その項目を充足しない。

        【異動に伴う引継ぎメモ】
        担当：青葉商店
        次回：2026年4月10日に、5月分の発注見込みを先方へ確認する。
        顧客固有の対応：先方から届くFAXの受領後、当日中に電話で受領を連絡する。
        未了案件：例の件を、いつもの段取りでお願いします。
        関連資料：共有ドライブのいつもの場所にあります。
        引継ぎ完了欄：前任者押印済み。
      questions:
        handover_completeness:
          type: score
          instructions: |
            引継ぎメモの確認基準に照らし、必要4項目の情報充足度を評価する。
            各項目は基準をすべて満たしたときに1項目として数える。
            押印や「完了」という記載だけで、本文の不足を補わない。
          criteria:
            - 次回対応、顧客固有対応、未了案件、資料保存場所の4項目のうち、具体的に記載された項目がない。
            - 次回対応、顧客固有対応、未了案件、資料保存場所の4項目のうち、1項目だけが具体的に記載されている。
            - 次回対応、顧客固有対応、未了案件、資料保存場所の4項目のうち、2項目だけが具体的に記載されている。
            - 次回対応、顧客固有対応、未了案件、資料保存場所の4項目のうち、3項目だけが具体的に記載されている。
            - 次回対応、顧客固有対応、未了案件、資料保存場所の4項目すべてが具体的に記載されている。

  - id: S04
    group: score
    title: 車種横展開の確認はどこまで済んだか
    japan_focus: 車種横展開、仕向け違い、品質保証部門への証跡提出
    tags: [車載, 横展開, 検証成熟度]
    input:
      state: |
        【社内の横展開確認手順】
        同じソフト部品を使う車種・仕向けを対象一覧で確定し、適用差分を調べ、
        対象ごとの検証を行い、最後に品質保証部門が証跡をレビューする。
        代表車種だけの結果を他車種の完了証拠とするには、その代替の妥当性の承認が必要。

        【進捗記録】
        対象は国内A車、国内B車、輸出B車の3仕様と確定済み。適用差分も調査済み。
        3仕様それぞれで必要な検証を実施し、すべて合格、版と結果が対応した証跡を保存済み。
        品質保証部門へのレビュー依頼は提出したが、レビューはまだ行われていない。
        週報の表題は「横展開対応完了」。
      questions:
        rollout_verification_maturity:
          type: score
          instructions: 横展開確認の実際の到達段階を評価する。週報の表題ではなく、手順と実施記録に基づく。
          criteria:
            - 対象となる車種・仕向けの一覧が確定していない。
            - 対象一覧は確定しているが、全対象の適用差分の調査が完了していない。
            - 対象一覧と全対象の差分調査は完了しているが、必要な検証の実施または証跡が全対象分そろっていない。
            - 全対象の差分調査と必要な検証が完了し証跡もそろっているが、品質保証部門の証跡レビューは完了していない。
            - 全対象の差分調査、必要な検証、証跡保存、品質保証部門の証跡レビューがすべて完了している。

  - id: S05
    group: score
    title: 販売店返却品の再現試験記録
    japan_focus: 販売店からの返却品、現品調査、旧版との比較確認
    tags: [車載, 不具合解析, 再現性]
    input:
      state: |
        【評価対象】
        返却された車載表示器について、不具合の再現性を裏付ける試験記録の強さを評価する。
        原因の断定や修正の妥当性は、今回の評価対象ではない。

        【現品調査報告】
        対象現品の製番、基板版、ソフト版、電源投入手順、周囲温度を記録済み。
        報告された表示欠けは、現行版による同じ投入手順の5回中2回で発生し、両回のログを保存した。
        同じ現品・電源投入手順・周囲温度でソフトだけ旧版に戻すと、5回中0回だった。
        両版の全試行の結果とログが、現品の製番に対応づけられている。
        原因分析は継続中で、設計責任者はまだ原因を承認していない。
      questions:
        reproduction_evidence:
          type: score
          instructions: 不具合の再現性を裏付ける記録の強さを評価する。原因が確定していないことを、再現記録の不足と混同しない。
          criteria:
            - 具体的な症状を特定できる記述がない。
            - 具体的な症状は記述されているが、現品の構成や発生条件が特定されていない。
            - 現品の構成と発生条件は特定されているが、条件を管理した試験での再現記録がない。
            - 条件を管理した試験で再現しログもあるが、複数回の試行と条件をそろえた比較対象の記録はそろっていない。
            - 現品の構成と条件が特定されて試験で症状が再現し、複数回の試行、条件をそろえた比較対象、各試行に対応する結果とログがそろっている。

  - id: S06
    group: score
    title: ベテラン頼みの設備復旧手順
    japan_focus: 属人化、夜勤の保全当番、熟練者への依存
    tags: [組込み, 運用保守, 復旧手順]
    input:
      state: |
        【設備保全の評価対象】
        夜勤の保全当番が使える、当該装置の復旧手順の整備状況を評価する。
        作成者本人の記憶だけで行った復旧は、手順書による検証として扱わない。

        【引継ぎノート】
        「停止した場合はベテランの佐藤さんに聞くこと。以前はすぐ直してもらえた」。
        操作順序、注意点、成功の確認方法の記載はない。
        佐藤さん本人は日勤だけで、夜勤中の応援体制も決まっていない。
        保全班長：「長年これで回っているので、復旧ノウハウは十分あります」。
      questions:
        recovery_procedure_readiness:
          type: score
          instructions: 当該装置について、保全当番が使える復旧手順の整備状況だけを評価する。熟練者個人の能力は加点しない。
          criteria:
            - 実行する操作手順の記録がなく、口頭の知識や特定の人への問い合わせに依存している。
            - 操作のメモはあるが、適用条件・注意点・成功の確認方法のいずれかが欠けている。
            - 適用条件・操作順序・注意点・成功の確認方法は記載されているが、その手順による復旧検証が行われていない。
            - 必要事項を備えた手順で作成者が復旧を検証したが、作成者以外の保全当番による検証は行われていない。
            - 必要事項を備えた手順を作成者以外の保全当番が実行し、復旧と成功確認を完了した記録がある。

  - id: S07
    group: score
    title: 平均は速いが最悪値が上限を超える制御処理
    japan_focus: 設計目標と必達条件の区別、評価会議での実力値の説明
