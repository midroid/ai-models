        平均値は参考値であり、合否や超過程度の評価には使わない。
        下記の段階は本案件だけの評価尺度である。

        【試験結果】
        指定の量産構成と負荷条件で測定済み。
        平均値は5.0ミリ秒、最悪値はちょうど12.0ミリ秒。測定条件の不足や測定誤差の問題はない。
        担当者：「平均では半分の時間ですので、実力的には余裕があります」。
      questions:
        deadline_overrun:
          type: score
          instructions: 本案件の最悪値の必達条件に対する超過程度を、提示された段階で評価する。平均値を代用しない。
          criteria:
            - 最悪値が10.0ミリ秒以下で、必達条件を満たす。
            - 最悪値が10.0ミリ秒を超え、11.0ミリ秒以下である。
            - 最悪値が11.0ミリ秒を超え、12.0ミリ秒以下である。
            - 最悪値が12.0ミリ秒を超え、15.0ミリ秒以下である。
            - 最悪値が15.0ミリ秒を超えている。

  - id: S08
    group: score
    title: 研修が盛況だった新しい販売管理システム
    japan_focus: 現場定着、集合研修、紙や旧システムからの業務移行
